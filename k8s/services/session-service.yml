apiVersion: v1
kind: Service
metadata:
  annotations: {}
  name: session-service
  namespace: distributed-tracing
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: session-service
  sessionAffinity: None
  type: ClusterIP
