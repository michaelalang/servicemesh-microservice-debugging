apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: distributed-tracing
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http-ui
      port: 3200
      protocol: TCP
      targetPort: 3200
    - name: grpc-otlp
      port: 4317
      protocol: TCP
      targetPort: 4317
    - name: http-otlp
      port: 4318
      protocol: TCP
      targetPort: 4318
  selector:
    app: tempo
  sessionAffinity: None
  type: ClusterIP
