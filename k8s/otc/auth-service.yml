apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  annotations: {}
  labels:
    app: auth-service
    mode: sidecar
  name: auth-service
  namespace: distributed-tracing
spec:
  config:
    exporters:
      debug:
        verbosity: basic
      otlphttp/tempo:
        endpoint: http://${TEMPOADDR}
        timeout: 30s
        tls:
          insecure: true
    processors:
      batch:
        send_batch_size: 256
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_percentage: 20
      resource:
        attributes:
        - action: upsert
          key: k8s.deployment.name
          value: auth-service
        - action: upsert
          key: service.namespace
          value: distributed-tracing
      tail_sampling:
        decision_wait: 5s
        expected_new_traces_per_sec: 50
        num_traces: 10000
        policies:
        - name: only-errors
          status_code:
            status_codes:
            - ERROR
          type: status_code
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.pod.start_time
          labels:
          - from: pod
            key: app
            tag_name: app.label.app
        filter:
          node_from_env_var: KUBE_NODE_NAME
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    service:
      pipelines:
        traces:
          exporters:
          - otlphttp/tempo
          processors:
          - memory_limiter
          - k8sattributes
          - resource
          - tail_sampling
          - batch
          receivers:
          - otlp
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
  configVersions: 3
  daemonSetUpdateStrategy: {}
  deploymentUpdateStrategy: {}
  httpRoute:
    enabled: false
    gateway: ''
  ingress:
    route: {}
  ipFamilyPolicy: SingleStack
  managementState: managed
  mode: sidecar
  networkPolicy:
    enabled: true
  observability:
    metrics: {}
  podAnnotations:
    sidecar.istio.io/nativeSidecar: 'true'
  podDnsConfig: {}
  replicas: 1
  resources: {}
  targetAllocator:
    allocationStrategy: consistent-hashing
    collectorNotReadyGracePeriod: 30s
    collectorTargetReloadInterval: 30s
    filterStrategy: relabel-config
    observability:
      metrics: {}
    prometheusCR:
      evaluationInterval: 30s
      podMonitorNamespaceSelector: {}
      probeNamespaceSelector: {}
      scrapeConfigNamespaceSelector: {}
      scrapeInterval: 30s
      serviceMonitorNamespaceSelector: {}
    resources: {}
  upgradeStrategy: automatic
  env:
  - name: TEMPOADDR
    valueFrom:
      configMapKeyRef:
        name: otel-tempo
        key: TEMPOADDR
  - name: KUBE_NODE_NAME
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: spec.nodeName
