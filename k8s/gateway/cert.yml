apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-cert
spec:
  commonName: GATEWAY_HOSTNAME
  dnsNames:
    - GATEWAY_HOSTNAME
  isCA: false
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: ca-issuer
  privateKey:
    algorithm: RSA
    size: 2048
  secretName: gateway-secret
  subject:
    countries:
      - US
    organizationalUnits:
      - Example
    organizations:
      - Example
