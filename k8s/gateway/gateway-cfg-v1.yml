apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: gateway-v1
spec:
  selector:
    istio: gateway-v1
  servers:
    - hosts:
        - GATEWAY_HOSTNAME
      port:
        name: https
        number: 8443
        protocol: HTTPS
      tls:
        credentialName: gateway-secret
        mode: SIMPLE
