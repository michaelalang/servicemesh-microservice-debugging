apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cert-manager.yml
- cert.yml
- gateway-cfg-v1.yml
- gateway-v1-svc.yml
- gateway-v1.yml
- rbac.yml
- route.yaml
- sa.yml
- telemetry.yml
- vs.yml
- vs-gw.yml

namespace: distributed-tracing

# Change this value to set the gateway hostname across cert, route, Gateway, and VirtualService.
configMapGenerator:
- name: gateway-params
  literals:
  - hostname=tracing.apps.example.com
  options:
    disableNameSuffixHash: true

replacements:
- source:
    kind: ConfigMap
    name: gateway-params
    fieldPath: data.hostname
  targets:
  - select:
      kind: Certificate
      name: gateway-cert
    fieldPaths:
    - spec.commonName
    - spec.dnsNames.0
  - select:
      kind: Route
      name: frontend-route-v1
    fieldPaths:
    - spec.host
  - select:
      kind: Gateway
      name: gateway-v1
    fieldPaths:
    - spec.servers.0.hosts.0
  - select:
      kind: VirtualService
      name: frontend-service
    fieldPaths:
    - spec.hosts.0
