apiVersion: v1
kind: ConfigMap
metadata:
  name: tempoconfig
  namespace: distributed-tracing
immutable: false
data:
  config.yml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    backend_scheduler:
      provider:
        compaction:
          compaction:
            block_retention: 3h

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
