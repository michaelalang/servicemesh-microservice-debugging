apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    sidecar.istio.io/nativeSidecar: 'true'
    sidecar.opentelemetry.io/inject: frontend
  name: frontend
  namespace: distributed-tracing
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        sidecar.istio.io/nativeSidecar: 'true'
        sidecar.opentelemetry.io/inject: frontend
      creationTimestamp: null
      labels:
        app: frontend
    spec:
      containers:
        - env:
            - name: SERVICE_NAME
              value: frontend
            - name: PORT
              value: '8080'
            - name: NEXT_APP
              value: http://api-gateway:8080
            - name: CQRS_COMMAND_URL
              value: http://order-service:8080
            - name: CQRS_QUERY_URL
              value: http://catalog-service:8080
            - name: OUTBOX_TARGET_URL
              value: http://audit-service:8080
          image: localhost/distributed-tracing:v1.0.0
          imagePullPolicy: Always
          name: frontend
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: frontend
      serviceAccountName: frontend
      terminationGracePeriodSeconds: 30
