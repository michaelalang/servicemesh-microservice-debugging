apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    sidecar.istio.io/nativeSidecar: 'true'
  name: tempo
  namespace: distributed-tracing
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: tempo
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        sidecar.istio.io/nativeSidecar: 'true'
      labels:
        app: tempo
    spec:
      containers:
        - image: registry.access.redhat.com/hi/tempo:latest
          imagePullPolicy: IfNotPresent
          name: tempo
          ports:
            - containerPort: 3200
              protocol: TCP
            - containerPort: 4317
              protocol: TCP
            - containerPort: 4318
              protocol: TCP
          resources: {}
          volumeMounts:
          - name: data
            mountPath: /var/tempo
          - name: config
            mountPath: /etc/tempo/config.yml
            subPath: config.yml
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: tempo
      serviceAccountName: tempo
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tempodata
      - name: config
        configMap:
          name: tempoconfig
