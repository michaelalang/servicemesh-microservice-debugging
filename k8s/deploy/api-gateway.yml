apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    sidecar.istio.io/nativeSidecar: 'true'
    sidecar.opentelemetry.io/inject: api-gateway
  name: api-gateway
  namespace: distributed-tracing
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        sidecar.istio.io/nativeSidecar: 'true'
        sidecar.opentelemetry.io/inject: api-gateway
      creationTimestamp: null
      labels:
        app: api-gateway
    spec:
      containers:
        - env:
            - name: SERVICE_NAME
              value: api-gateway
            - name: PORT
              value: '8080'
            - name: NEXT_APP
              value: http://auth-service:8080
          image: localhost/distributed-tracing:v1.0.0
          imagePullPolicy: Always
          name: api-gateway
          ports:
            - containerPort: 8080
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: api-gateway
      serviceAccountName: api-gateway
      terminationGracePeriodSeconds: 30
